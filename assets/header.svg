<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2F1FF" />
      <stop offset="75%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="cyan-emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pill-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b" fill-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      font-size: 52px;
      fill: url(#title-grad);
    }
    .tagline-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 3px;
      fill: #00D2FF;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      letter-spacing: 0.5px;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
      fill: #ffffff;
    }
  </style>

  <!-- Card Background with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Dot Grid Pattern Overlay -->
  <rect x="4" y="4" width="1192" height="312" rx="18" fill="url(#dot-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="130" fill="#00D2FF" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="140" fill="#10B981" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="160" r="120" fill="#6366F1" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Decorative Circuit / Top Accent Line -->
  <path d="M 60 45 L 200 45 L 220 65 L 420 65" fill="none" stroke="#00D2FF" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="420" cy="65" r="3" fill="#00D2FF" fill-opacity="0.7" />
  
  <path d="M 1140 45 L 1000 45 L 980 65 L 780 65" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="780" cy="65" r="3" fill="#10B981" fill-opacity="0.7" />

  <!-- Top Category Chip -->
  <g transform="translate(600, 52)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#0c1829" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" text-anchor="middle" class="tagline-text">✦ ENTERPRISE INFRASTRUCTURE &amp; DEVSECOPS ✦</text>
  </g>

  <!-- Main Title: RAMNEEK SHRIWADI -->
  <text x="600" y="132" text-anchor="middle" class="title-text">RAMNEEK SHRIWADI</text>

  <!-- Subtitle: Lead DevSecOps Engineer | Enterprise Cloud Architect -->
  <text x="600" y="174" text-anchor="middle" class="subtitle-text">
    Lead DevSecOps Engineer  <tspan fill="#00D2FF">•</tspan>  Enterprise Cloud Architect  <tspan fill="#10B981">•</tspan>  FinOps &amp; AIOps Specialist
  </text>

  <!-- Feature Pills / Competencies -->
  <g transform="translate(600, 242)">
    <!-- Pill 1: 10+ Years Experience -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#0284C7" stroke-width="1.5" />
      <circle cx="20" cy="0" r="5" fill="#38BDF8" />
      <text x="92" y="5" text-anchor="middle" class="pill-text">10+ YRS EXP</text>
    </g>

    <!-- Pill 2: 100+ App Migrations -->
    <g transform="translate(-275, 0)">
      <rect x="0" y="-18" width="235" height="36" rx="18" fill="#0f172a" stroke="#8B5CF6" stroke-width="1.5" />
      <circle cx="20" cy="0" r="5" fill="#A78BFA" />
      <text x="130" y="5" text-anchor="middle" class="pill-text">100+ APP MIGRATIONS</text>
    </g>

    <!-- Pill 3: Zero-Trust DevSecOps -->
    <g transform="translate(-15, 0)">
      <rect x="0" y="-18" width="220" height="36" rx="18" fill="#0f172a" stroke="#EF4444" stroke-width="1.5" />
      <circle cx="20" cy="0" r="5" fill="#F87171" />
      <text x="122" y="5" text-anchor="middle" class="pill-text">ZERO-TRUST POSTURE</text>
    </g>

    <!-- Pill 4: FinOps Cloud Economics -->
    <g transform="translate(230, 0)">
      <rect x="0" y="-18" width="230" height="36" rx="18" fill="#0f172a" stroke="#10B981" stroke-width="1.5" />
      <circle cx="20" cy="0" r="5" fill="#34D399" />
      <text x="127" y="5" text-anchor="middle" class="pill-text">FINOPS OPTIMIZATION</text>
    </g>
  </g>

  <!-- Bottom Tech Accent Lines -->
  <line x1="200" y1="298" x2="1000" y2="298" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.4" />
</svg>

